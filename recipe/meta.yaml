{% set name = "lupa" %}
{% set version = "2.8" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d8022641b9ec8ecf2c5ecbe9f47e5a70e0b87c4b5ae921b92cb02a638e0acd08

  patches:
    - patches/0001-fix-win-luajit-dll-copy-fail-if-not-exist.patch      # [win]

build:
  number: 1
  skip: true  # [py<38]

  # Unvendor bundled Lua/LuaJIT sources: force setup.py to use external
  # dependencies from the build environment instead of vendored third-party code.
  script_env:
    - LUPA_NO_BUNDLE=true

requirements:
  build:
    - pkg-config              # [unix]
    - make                    # [unix]
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - cython >=3.2.4
    - setuptools
    - wheel
    - python
    - pip
    # Build against external LuaJIT on most platforms. LuaJIT has no official
    # MSVC/ARM64 port (its ARM64 support relies on clang/GCC, not MSVC), so
    # win-arm64 builds against plain Lua instead; lupa has supported Lua 5.4+
    # natively since 1.10, and 5.5 is the version available on win-arm64 main.
    - luajit  # [not (win and arm64)]
    - lua 5.5.*  # [win and arm64]
  run:
    - python
    # luajit carries run_exports and propagates itself into run: automatically.
    # Plain lua does not define run_exports, so win-arm64 needs it listed explicitly
    # to avoid an overlinking error (the compiled extension links against lua.dll).
    - lua 5.5.*  # [win and arm64]

test:
  imports:
    - lupa
    - lupa.version
  commands:
    - pip check
    - python -c "import lupa; lua=lupa.LuaRuntime(); assert lua.eval('1+1') == 2"
    - python -c "import lupa; assert lupa.LuaRuntime().lua_implementation"
  requires:
    - pip

about:
  home: https://github.com/scoder/lupa
  summary: Python wrapper around Lua and LuaJIT
  description: |
    Lupa integrates the runtimes of Lua or LuaJIT2 into CPython. 
    It is a partial rewrite of LunaticPython in Cython with some
    additional features such as proper coroutine support.
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  dev_url: https://github.com/scoder/lupa
  doc_url: https://github.com/scoder/lupa/blob/master/README.rst

extra:
  recipe-maintainers:
    - lincrosenbach
    - mv-per
    - brnomendes
    - mediocretech
